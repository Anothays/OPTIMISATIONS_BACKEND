apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sakila
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: spring-boot
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["sakila-api:8080"]
            labels:
              application: perf-baseline

    rule_files:
      - /etc/prometheus/rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
  rules.yml: |
    groups:
      - name: api
        rules:
          - alert: ApiDown
            expr: up{job="spring-boot"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "API injoignable"
              description: "Prometheus ne peut plus scraper {{ $labels.instance }}."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sakila
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sakila
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
