apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: sakila
type: Opaque
stringData:
  alertmanager.yml: |
    route:
      receiver: discord
      group_by: [alertname, application]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    receivers:
      - name: discord
        discord_configs:
          - webhook_url: https://discord.com/api/webhooks/1575098275936346147/q-1HRkPTDFw6fPVW2hbLKHEyqj0OsSTeamj4UTTmaIIuD4G7gcxm6iL9MD7ZlvlwdDxA
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: sakila
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sakila
spec:
  selector:
    app: alertmanager
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093
      nodePort: 30093
  type: NodePort
