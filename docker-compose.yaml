services:

  db:
    container_name: db
    build: .
    ports:
      - 3306:3306
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM store LIMIT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sakila
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/config.yml:/etc/prometheus/config.yml:ro

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.0
    ports:
      - 3000:3000

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:v0.27.0
    ports:
      - 9093:9093


